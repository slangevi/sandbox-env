name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Syntax check CLI
        run: bash -n cli/sandbox

      - name: Syntax check entrypoint scripts and the comfy helper
        run: bash -n base/entrypoint.sh base/init-firewall.sh features/comfyui.d/comfy

      # These two need neither Docker nor the base image, so they run first
      # for fast feedback. test-comfy-helper drives the comfy helper against a
      # stub ComfyUI written in python3 (present on ubuntu-latest).
      - name: Test feature asset staging
        run: tests/test-build-assets.sh

      - name: Test comfy helper (stub ComfyUI)
        run: tests/test-comfy-helper.sh

      - name: Build base image
        run: cli/sandbox build-base

      - name: Test base image
        run: tests/test-base.sh

      # The strict firewall must reach the host at host.docker.internal from a
      # joined network (features: [comfyui]); needs NET_ADMIN and host python3.
      - name: Test firewall host alias on a joined network
        run: tests/test-firewall-host-alias.sh

      - name: Test CLI commands
        run: tests/test-cli.sh

      - name: Test CLI error handling
        run: tests/test-cli-errors.sh

      - name: Test run modes
        run: tests/test-run-modes.sh

      - name: Test volumes
        run: tests/test-volumes.sh

      - name: Test git config
        run: tests/test-git-config.sh

      - name: Test headless mode
        run: tests/test-headless.sh

      - name: Test convenience commands
        run: tests/test-commands.sh

      - name: Test sparkyard backend
        run: tests/test-spark.sh

      - name: Test YAML validation
        run: tests/test-yaml-validation.sh

      - name: Test config trust
        run: tests/test-config-trust.sh

      - name: Test ComfyUI backend (discovery, argument wiring)
        run: tests/test-comfy.sh

      - name: Test CLI integration (start, exec, stop lifecycle)
        run: tests/test-cli-integration.sh

      - name: Test entrypoint (PATH, volumes, permissions, services)
        run: tests/test-entrypoint.sh

      - name: Test integration (python + llm)
        run: tests/test-integration.sh

      # Skips with a stated reason when no live ComfyUI container is present,
      # which is always the case on a hosted runner. Kept so the step runs
      # for real on a self-hosted runner with a GPU.
      - name: Test ComfyUI end to end
        run: tests/test-comfy-e2e.sh
